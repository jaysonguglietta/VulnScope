name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npm run verify
          npm audit signatures

      - name: Build Lambda artifact
        run: |
          rm -rf .deploy
          mkdir -p .deploy/lambda
          cp server.mjs lambda.mjs monitor.mjs package.json package-lock.json .deploy/lambda/
          npm ci --prefix .deploy/lambda --omit=dev --ignore-scripts
          (cd .deploy/lambda && zip -qr ../lambda.zip .)
          sha256sum .deploy/lambda.zip > .deploy/lambda.zip.sha256

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .deploy/lambda
          format: spdx-json
          output-file: .deploy/vulnscope-lambda.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attest artifact and SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            .deploy/lambda.zip
            .deploy/vulnscope-lambda.spdx.json

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnscope-${{ github.sha }}
          path: |
            .deploy/lambda.zip
            .deploy/lambda.zip.sha256
            .deploy/vulnscope-lambda.spdx.json
          if-no-files-found: error
          retention-days: 30
