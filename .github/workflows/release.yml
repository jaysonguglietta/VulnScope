name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source
        run: |
          npm ci --ignore-scripts
          npm run verify
          npm audit signatures

      - name: Verify browser release workflows
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build complete deployment artifact
        run: npm run build:release

      - name: Verify extracted runtime
        run: npm run test:bundle

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .deploy/lambda
          format: spdx-json
          output-file: .deploy/vulnscope-lambda.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Attest artifact and SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            .deploy/deployment.tar.gz
            .deploy/vulnscope-lambda.spdx.json

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnscope-${{ github.sha }}
          path: |
            .deploy/deployment.tar.gz
            .deploy/deployment.tar.gz.sha256
            .deploy/vulnscope-lambda.spdx.json
          if-no-files-found: error
          retention-days: 30
