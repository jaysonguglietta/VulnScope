name: Infrastructure security

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint CloudFormation
        run: pipx run --spec cfn-lint==1.55.0 cfn-lint infra/*.yml

      - name: Scan CloudFormation security
        # These exclusions match documented low-cost architecture decisions: no
        # request/access logging, VPC, DLQ, or customer-managed KMS resources.
        # All other current and future Checkov findings remain blocking.
        run: >-
          pipx run --spec checkov==3.3.10 checkov
          --directory infra
          --framework cloudformation
          --quiet
          --skip-check
          CKV_AWS_18,CKV_AWS_26,CKV_AWS_28,CKV_AWS_68,CKV_AWS_86,CKV_AWS_95,CKV_AWS_116,CKV_AWS_117,CKV_AWS_119,CKV_AWS_158,CKV_AWS_173
