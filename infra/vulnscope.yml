AWSTemplateFormatVersion: "2010-09-09"
Description: VulnScope serverless hosting stack.

Parameters:
  DomainName:
    Type: String
    Default: vulnscope.jsontechnology.com
  HostedZoneId:
    Type: String
  StaticBucketName:
    Type: String
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  NotificationEmail:
    Type: String
    Default: ""
  MonitoredCves:
    Type: String
    Default: ""
  MonitorScheduleExpression:
    Type: String
    Default: rate(1 day)
  ApiOriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32

Conditions:
  EnableScheduledMonitor: !And
    - !Not [!Equals [!Ref NotificationEmail, ""]]
    - !Not [!Equals [!Ref MonitoredCves, ""]]

Resources:
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref StaticBucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldStaticVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vulnscope-api
      RetentionInDays: 30

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambda-basic-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vulnscope-api:*

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: vulnscope-api
      Description: VulnScope CVE research API.
      Runtime: nodejs22.x
      Handler: lambda.handler
      Role: !GetAtt ApiFunctionRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 20
      ReservedConcurrentExecutions: 2
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          NODE_ENV: production
          RATE_LIMIT_MAX: "30"
          REFRESH_RATE_LIMIT_MAX: "6"
          RATE_LIMIT_WINDOW_MS: "60000"
          RESEARCH_CONCURRENCY: "4"
          RESEARCH_QUEUE_MAX: "20"
          OUTBOUND_CONCURRENCY: "8"
          OUTBOUND_QUEUE_MAX: "50"
          CACHE_MAX_ENTRIES: "300"
          RESPONSE_MAX_BYTES: "8388608"
          API_BODY_MAX_BYTES: "262144"
          ENRICHMENT_PACKAGE_MAX: "50"
          ENRICHMENT_VULNERABILITY_MAX: "40"
          ENRICHMENT_OUTBOUND_MAX_CALLS: "41"
          ENRICHMENT_OUTBOUND_MAX_BYTES: "33554432"
          ENRICHMENT_DEADLINE_MS: "15000"
          OSV_DETAIL_CACHE_TTL_MS: "3600000"
          OSV_DETAIL_CACHE_MAX_ENTRIES: "500"
          ORIGIN_VERIFY_SECRET: !Ref ApiOriginSecret

  MonitorTable:
    Type: AWS::DynamoDB::Table
    Condition: EnableScheduledMonitor
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cve
          AttributeType: S
      KeySchema:
        - AttributeName: cve
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  MonitorTopic:
    Type: AWS::SNS::Topic
    Condition: EnableScheduledMonitor
    Properties:
      DisplayName: VulnScope CVE monitor

  MonitorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableScheduledMonitor
    Properties:
      LogGroupName: /aws/lambda/vulnscope-monitor
      RetentionInDays: 30

  MonitorEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableScheduledMonitor
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref MonitorTopic

  MonitorFunctionRole:
    Type: AWS::IAM::Role
    Condition: EnableScheduledMonitor
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: monitor-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vulnscope-monitor:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt MonitorTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref MonitorTopic

  MonitorFunction:
    Type: AWS::Lambda::Function
    Condition: EnableScheduledMonitor
    DependsOn: MonitorLogGroup
    Properties:
      FunctionName: vulnscope-monitor
      Description: Refreshes deployment-configured CVEs and sends material-change notifications.
      Runtime: nodejs22.x
      Handler: monitor.handler
      Role: !GetAtt MonitorFunctionRole.Arn
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          NODE_ENV: production
          MONITORED_CVES: !Ref MonitoredCves
          MONITOR_TABLE_NAME: !Ref MonitorTable
          MONITOR_TOPIC_ARN: !Ref MonitorTopic
          RESEARCH_CONCURRENCY: "2"
          RESEARCH_QUEUE_MAX: "5"
          OUTBOUND_CONCURRENCY: "6"
          OUTBOUND_QUEUE_MAX: "40"
          RESPONSE_MAX_BYTES: "8388608"

  MonitorSchedule:
    Type: AWS::Events::Rule
    Condition: EnableScheduledMonitor
    Properties:
      Description: Daily VulnScope monitored CVE refresh.
      ScheduleExpression: !Ref MonitorScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt MonitorFunction.Arn
          Id: VulnScopeMonitor

  MonitorInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: EnableScheduledMonitor
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MonitorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MonitorSchedule.Arn

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: vulnscope-http-api
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  HttpApiHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/health
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiResearchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/research
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiEnrichRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/enrich
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/api/*

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        Description: VulnScope S3 origin access control.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-security-headers
        Comment: VulnScope security headers.
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: no-referrer
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()

  ApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}-api-rate-limit
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-api-web-acl
        SampledRequestsEnabled: true
      Rules:
        - Name: ApiIpRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-api-ip-rate-limit
            SampledRequestsEnabled: true
        - Name: KnownBadInputs
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub ${AWS::StackName}-known-bad-inputs
            SampledRequestsEnabled: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        WebACLId: !GetAtt ApiWebAcl.Arn
        Comment: VulnScope serverless site.
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: StaticS3Origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref OriginAccessControl
          - Id: ApiGatewayOrigin
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref ApiOriginSecret
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: StaticS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: https-only
            Compress: false
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              # CloudFront requires the full method group when POST is enabled.
              # API Gateway's explicit routes remain the application allowlist.
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DnsARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  DnsAAAARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

Outputs:
  DomainName:
    Value: !Ref DomainName
  StaticBucketName:
    Value: !Ref StaticBucket
  ApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiFunctionName:
    Value: !Ref ApiFunction
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  MonitorTopicArn:
    Condition: EnableScheduledMonitor
    Value: !Ref MonitorTopic
